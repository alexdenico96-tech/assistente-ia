<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connor</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <h1>🤖 Connor</h1>
    </header>

    <div class="chat-mensagens" id="chatMensagens">
      <div class="mensagem mensagem-assistente">
        Oi! Eu sou o Connor, como posso ajudar?
      </div>
    </div>

    <div class="chat-digitando" id="chatDigitando" style="display: none;">
      <span></span><span></span><span></span>
    </div>

    <form class="chat-form" id="chatForm">
      <input
        type="text"
        id="chatInput"
        placeholder="Pergunte algo, ex: 'Qual a experiência dele na Accenture?'"
        autocomplete="off"
        required
      >
      <button type="submit" id="chatBotao">Enviar</button>
    </form>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
